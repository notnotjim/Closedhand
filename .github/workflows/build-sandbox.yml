name: Build Sandbox Image

on:
  push:
    branches: [main]
    paths:
      - 'sandbox-image/**'
  # A published image can be broken without its source changing: the 16 Aug
  # build emitted a zero-byte /entrypoint.sh from a 4032-byte source file and
  # every self-host install pulled a sandbox that could not start. Rebuilding
  # then needed a no-op commit to sandbox-image/ just to trip the path filter.
  workflow_dispatch:

# One build at a time, oldest first: each pushes :latest when it finishes, and
# two overlapping once left :latest on the older commit's webapp (8ee4201 over
# 554bac7, 2026-10-27), so new installs and updates got older code.
concurrency:
  group: sandbox-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Intel runners, but self-hosters run Apple Silicon too; QEMU plus the
      # container driver is what lets one job publish both architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: sandbox-image
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/closedhand-sandbox:latest
          # Ties the published package to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
