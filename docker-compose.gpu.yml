# Hands this computer's NVIDIA graphics card to Closedhand for image
# generation (lib/image-generation.js). install.sh adds this file, through
# COMPOSE_FILE in .env, where it finds the card and NVIDIA's container toolkit.
# "graphics" brings the driver's Vulkan, which stable-diffusion.cpp runs on.
# `gpus` rather than deploy.resources: docker-compose.yml's mem_reservation
# can't sit beside a deploy reservation.
services:
  bot:
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
